<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/marca/icono.svg" type="image/svg+xml"><link rel="icon" href="assets/marca/icono-32.png" sizes="32x32"><link rel="apple-touch-icon" href="assets/marca/icono-apple.png"><meta name="theme-color" content="#0B0C0E">
<link rel="stylesheet" href="assets/estilo.css">
<style>
.panel{display:grid;grid-template-columns:250px 1fr;gap:30px;padding:30px 0 70px;align-items:start}
.panel.sin-lateral{grid-template-columns:minmax(0,1fr)}
.panel.sin-lateral .lateral{display:none}
.tit-lateral{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2);padding:0 14px;margin-top:4px}
.lateral{position:sticky;top:86px}
.lateral nav{display:grid;gap:4px;margin-top:16px}
.lateral nav button{border:0;background:transparent;text-align:left;padding:11px 14px;border-radius:10px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
.lateral nav button:hover{background:var(--papel-2)}
.lateral nav button[aria-current="true"]{background:var(--tinta);color:var(--papel)}
.lateral nav .num{background:var(--butano);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-family:var(--mono)}
.rol{display:flex;border:1px solid var(--linea-2);border-radius:10px;overflow:hidden;background:var(--hoja)}
.rol button{flex:1;border:0;background:transparent;padding:9px;font-weight:650;font-size:14px}
.rol button[aria-pressed="true"]{background:var(--butano);color:#fff}
.vista{animation:entraV .4s cubic-bezier(.2,.8,.2,1)}
@keyframes entraV{from{opacity:0;transform:translateY(14px)}}
.vista h1{font-size:clamp(34px,4.6vw,56px);margin-bottom:22px}
.tarjetas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.dato{padding:20px}
.dato b{display:block;font-size:38px;font-weight:700;line-height:1;margin-top:6px}
.fila-clase{display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;padding:16px 20px}
.fila-clase+.fila-clase{border-top:1px dashed var(--linea)}
.fecha{border:1px solid var(--linea-2);border-radius:10px;text-align:center;overflow:hidden;background:var(--hoja)}
.fecha span{display:block;background:var(--butano);color:#fff;font-family:var(--mono);font-size:11px;padding:2px;text-transform:uppercase}
.fecha b{display:block;font-size:26px;padding:4px 0}
.informe{padding:24px}
.informe+.informe{margin-top:16px}
.informe .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.informe .tres div{border-left:3px solid var(--c);padding-left:12px}
.informe .tres p:first-child{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--c)}
.chat{display:grid;grid-template-columns:260px 1fr;height:560px;overflow:hidden;padding:0}
.convs{border-right:1px solid var(--linea-2);overflow:auto}
.convs button{display:flex;gap:10px;width:100%;border:0;border-bottom:1px dashed var(--linea);background:transparent;padding:14px;text-align:left;align-items:center}
.convs button[aria-current="true"]{background:var(--papel-2)}
.convs small{display:block;color:var(--tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.hilo{display:flex;flex-direction:column;min-width:0}
.hilo-cab{padding:14px 18px;border-bottom:1px solid var(--linea-2);display:flex;gap:10px;align-items:center}
.mensajes{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background-image:radial-gradient(rgba(29,36,32,.05) 1px,transparent 1px);background-size:16px 16px}
.msj{max-width:75%;padding:10px 14px;border-radius:14px;border:1px solid var(--linea-2);background:var(--hoja);animation:msj .3s cubic-bezier(.2,1.3,.4,1)}
.msj.mio{align-self:flex-end;background:var(--placa);color:#fff;border-color:var(--placa)}
.msj small{display:block;font-family:var(--mono);font-size:10px;opacity:.7;margin-top:4px}
@keyframes msj{from{opacity:0;transform:scale(.9) translateY(8px)}}
.escribe{display:flex;gap:8px;padding:12px;border-top:1px solid var(--linea-2)}
.escribiendo{font-size:13px;color:var(--tinta-2);padding:0 18px 8px;height:22px}
.aviso-chat{font-size:12px;color:var(--tinta-2);text-align:center;padding:6px 18px}
.tramo{margin-top:10px}
.tramo-barra{display:flex;height:12px;border-radius:9px;overflow:hidden;border:1px solid var(--linea-2);margin:8px 0 4px}
.tramo-barra i{display:block;height:100%}
.ingresos{display:flex;align-items:flex-end;gap:12px;height:200px;padding-top:20px}
.ingresos div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.ingresos i{width:100%;background:var(--ok);border:1px solid var(--linea-2);border-radius:6px 6px 0 0;display:block;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.ingresos span{font-family:var(--mono);font-size:11px;color:var(--tinta-2)}
.bienvenida{padding:22px 26px;background:var(--ok);color:#fff;border-color:var(--tinta);margin-bottom:22px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
@media (max-width:980px){.panel{grid-template-columns:1fr}.lateral{position:static}.lateral nav{grid-auto-flow:column;overflow-x:auto;grid-auto-columns:max-content}.tarjetas{grid-template-columns:1fr 1fr}.informe .tres{grid-template-columns:1fr}}
@media (max-width:700px){.chat{grid-template-columns:1fr;height:auto}.convs{border-right:0;border-bottom:1px solid var(--linea-2);display:flex;overflow-x:auto}.convs button{min-width:200px;border-bottom:0;border-right:1px dashed var(--linea)}.mensajes{height:380px}.tarjetas{grid-template-columns:1fr}.fila-clase{grid-template-columns:60px 1fr}.fila-clase>:last-child{grid-column:1/-1}}
/* ---------- Panel de la familia ---------- */
.inicio-f{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:8px}
.hero-clase{padding:24px;display:flex;gap:20px;align-items:center;border-color:var(--butano)}
.hero-clase h2{font-size:clamp(24px,2.6vw,32px);margin:6px 0 6px;line-height:1.1}
.fecha.grande{min-width:84px}
.fecha.grande b{font-size:38px;padding:6px 0 0}
.fecha.grande small{display:block;font-size:12px;color:var(--tinta-2);padding-bottom:6px;text-transform:uppercase}
.acciones-hero{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.accesos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acceso{padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:pointer;color:var(--tinta);transition:border-color .15s,transform .15s}
.acceso:hover{border-color:var(--butano);transform:translateY(-2px)}
.acceso b{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em}
.acceso span{font-size:14px;color:var(--tinta-2)}
.cab-seccion{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 12px}
.cab-seccion h2{font-size:26px}
.enlace-sec{border:0;background:transparent;color:var(--butano);font-weight:600;font-size:15px;padding:4px 0}
.enlace-sec:hover{text-decoration:underline}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dia-sem{border:1px solid var(--linea-2);border-radius:14px;padding:10px 8px;min-height:120px;display:flex;flex-direction:column;gap:6px;background:var(--hoja)}
.dia-sem.hoy{border-color:var(--butano);box-shadow:inset 0 0 0 1px var(--butano)}
.dia-sem p{font-size:13px;color:var(--tinta-2);text-transform:capitalize}
.dia-sem p b{font-size:18px;color:var(--tinta)}
.dia-sem .libre{font-size:12px;color:var(--tinta-2);opacity:.6}
.ev{border:0;border-radius:9px;padding:6px 8px;text-align:left;font-size:12.5px;line-height:1.25;background:var(--butano-claro);color:var(--tinta);cursor:pointer;overflow-wrap:anywhere}
.ev b{display:block;font-size:12px;color:var(--butano)}
.ev.grupo{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ev.grupo b{color:var(--ok)}
.ev.cancelada{opacity:.55;text-decoration:line-through}
.fila-profes{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip-profe{display:flex;gap:10px;align-items:center;padding:12px 16px 12px 12px;min-width:220px;text-align:left;cursor:pointer;color:var(--tinta);text-decoration:none;flex:none}
.chip-profe:hover{border-color:var(--butano)}
.chip-profe small{display:block;color:var(--tinta-2);font-size:13px}
.mas-icono{width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--linea-2);display:grid;place-items:center;font-size:20px;color:var(--tinta-2);flex:none}
.grupos-p,.profes-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tarjeta-grupo,.mi-profe{padding:20px}
.etiqueta-p{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--papel-2);border:1px solid var(--linea);white-space:nowrap}
.etiqueta-p.priv{background:var(--butano-claro);border-color:transparent;color:var(--butano)}
.datos-profe{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;font-size:14.5px}
.datos-profe li{padding-left:16px;position:relative}
.datos-profe li::before{content:'';position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--butano)}
.estado-ev{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--papel-2);margin-left:4px;white-space:nowrap}
.estado-ev.cancelada{color:var(--aviso)}
.estado-ev.extra{color:var(--ok)}
.estado-ev.pedida,.estado-ev.prevista{color:var(--butano)}
.fila-clase.tachada b{text-decoration:line-through;opacity:.6}
.cal-p{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.cal-mes{padding:20px}
.cal-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-cab h3{font-size:19px}
.cal-cab button{width:38px;height:38px;border-radius:10px;border:1px solid var(--linea-2);background:transparent;font-size:18px;color:var(--tinta)}
.cal-sem,.cal-rej{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-sem span{text-align:center;font-size:12px;font-weight:600;color:var(--tinta-2);padding:4px 0}
.cdia{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14.5px;color:var(--tinta)}
.cdia:hover{background:var(--papel-2)}
.cdia.fuera{visibility:hidden}
.cdia.hoy{border-color:var(--linea-2);font-weight:700}
.cdia.sel{border-color:var(--butano);background:var(--butano-claro)}
.cdia.pasada{opacity:.5}
.puntos-c{display:flex;gap:3px}
.puntos-c i,.leyenda-c i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--butano)}
.puntos-c i.grupo,.leyenda-c i.grupo{background:var(--ok)}
.puntos-c i.cancelada,.leyenda-c i.cancelada{background:transparent;border:1.5px solid var(--aviso)}
.puntos-c i.sinAceptar,.leyenda-c i.sinAceptar{background:transparent;border:1.5px solid var(--butano)}
.puntos-c i.hecha,.leyenda-c i.hecha{background:var(--tinta-2);opacity:.6}
.estado-ev.sinAceptar{color:var(--butano)}
/* Inicio del profe: la agenda del día, sin cajas ni adornos */
.ini-profe{max-width:980px}
.ini-cab{padding:6px 0 26px;border-bottom:1px solid var(--linea-2)}
.ini-cab>p:first-child{font-size:14px;color:var(--tinta-2)}
.ini-cab h1{font-size:clamp(30px,3.6vw,42px);font-weight:600;letter-spacing:-.02em;margin:4px 0 0}
.ini-frase{font-size:18px;color:var(--tinta-2);margin-top:8px;max-width:620px;line-height:1.45}
.ini-cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:48px;padding-top:22px}
/* Tira de la semana */
.semana-ini{display:flex;align-items:center;gap:6px;padding:18px 0 6px;border-bottom:1px solid var(--linea-2)}
.sem-dias{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sem-flecha{width:34px;height:34px;border-radius:50%;border:1px solid var(--linea-2);background:transparent;color:var(--tinta);font-size:18px;flex:none;cursor:pointer;transition:background .15s}
.sem-flecha:hover{background:var(--papel-2)}
.dia-chip{border:0;background:transparent;border-radius:14px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--tinta);transition:background .15s,transform .15s}
.dia-chip:hover{background:var(--papel-2)}
.dia-chip:active{transform:scale(.96)}
.dia-chip span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2)}
.dia-chip b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.dia-chip.hoy b{color:var(--butano)}
.dia-chip.pasado{opacity:.55}
.dia-chip.sel{background:var(--tinta);color:var(--papel)}
.dia-chip.sel span{color:color-mix(in srgb,var(--papel) 70%,transparent)}
.dia-chip.sel.hoy b{color:var(--papel)}
.dia-chip i{display:flex;gap:3px;height:6px}
.dia-chip em{width:5px;height:5px;border-radius:50%;background:var(--butano)}
.dia-chip.sel em{background:var(--papel)}
/* Clases desplegables */
.ag-fila{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px;margin:-8px -10px;border-radius:12px;cursor:pointer;transition:background .15s}
.ag-fila:hover{background:var(--papel-2)}
.ag-fila:focus-visible{outline:2px solid var(--butano);outline-offset:2px}
.ag-fila small{display:block;font-size:14px;color:var(--tinta-2);margin-top:2px}
.agenda .ag-item{grid-template-columns:minmax(0,1fr);padding-right:0}
.ag-fila>span{flex:1;min-width:0}
.ag-flecha{width:8px;height:8px;border-right:2px solid var(--tinta-2);border-bottom:2px solid var(--tinta-2);transform:rotate(45deg);transition:transform .2s;flex:none;margin-right:4px}
.ag-item.abierta .ag-flecha{transform:rotate(225deg)}
.ag-det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.ag-det>div{overflow:hidden}
.ag-item.abierta .ag-det{grid-template-rows:1fr}
.ag-datos{margin:14px 0 0;display:grid;gap:6px}
.ag-datos div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:14.5px}
.ag-datos dt{color:var(--tinta-2)}
.ag-datos dd{margin:0}
.ag-botones{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.ag-item.por-confirmar::before{background:transparent;border:1.5px solid var(--aviso);left:-5px}
.ag-nota.hecha{color:var(--tinta-2)}
/* Solicitudes en el inicio */
.ini-lista.sol li{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ini-lista.sol small{display:block;font-size:13.5px;color:var(--tinta-2)}
.sol-botones{display:flex;gap:6px;flex:none}
.sol-si,.sol-no{border:1px solid var(--linea-2);background:transparent;color:var(--tinta);border-radius:99px;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
.sol-si{padding:5px 12px}
.sol-si:hover{background:var(--ok);border-color:var(--ok);color:#fff}
.sol-no{width:30px;height:30px;padding:0}
.sol-no:hover{border-color:var(--aviso);color:var(--aviso)}
@media (max-width:560px){.semana-ini{gap:2px}.sem-flecha{width:28px;height:28px}.dia-chip b{font-size:17px;width:28px;height:28px}.dia-chip span{font-size:10.5px}.ag-datos div{grid-template-columns:1fr}}
.ini-tit{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.ini-tit h2{font-size:15px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--tinta-2)}
.ag-accion{border:0;background:none;padding:0;color:var(--butano);font-weight:600;font-size:14px;cursor:pointer}
.ag-accion:hover{text-decoration:underline}
.agenda{list-style:none;margin:0;padding:0;border-left:1px solid var(--linea-2);margin-left:58px}
.ag-item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:12px 0 12px 20px}
.ag-item+.ag-item{border-top:1px solid var(--linea)}
.ag-item time{position:absolute;left:-58px;width:46px;top:12px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.ag-item time small{display:block;font-weight:400;font-size:12px;color:var(--tinta-2)}
.ag-item b{font-size:16px}
.ag-item div>span:last-child{display:block;font-size:14px;color:var(--tinta-2);margin-top:2px}
.ag-item::before{content:'';position:absolute;left:-4px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--tinta-2)}
.ag-item.ya::before{background:var(--butano);box-shadow:0 0 0 3px var(--butano-claro)}
.ag-item.pasada{color:var(--tinta-2)}
.ag-item.pasada b{font-weight:500}
.ag-nota{font-size:12.5px;color:var(--aviso);margin-left:4px}
.ag-nota.ya{color:var(--butano)}
.ag-ahora{position:relative;height:0;border-top:1.5px solid #E5484D;margin:2px 0 2px -1px}
.ag-ahora span{position:absolute;left:-58px;top:-9px;width:46px;text-align:right;font-size:12px;font-weight:600;color:#E5484D;font-variant-numeric:tabular-nums}
.ini-vacio{font-size:15px;color:var(--tinta-2)}
.ini-lado{display:grid;gap:28px;align-content:start}
.ini-lista{list-style:none;margin:0;padding:0}
.ini-lista li{padding:9px 0;border-bottom:1px solid var(--linea);font-size:15px;line-height:1.4}
.ini-lista li:last-child{border-bottom:0}
.ini-datos{margin:0;display:grid}
.ini-datos div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:15px}
.ini-datos div:last-child{border-bottom:0}
.ini-datos dt{color:var(--tinta-2)}
.ini-datos dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.ini-perfil{font-size:14.5px;color:var(--tinta-2)}
@media (max-width:860px){.ini-cols{grid-template-columns:1fr;gap:34px}}
.leyenda-c{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--tinta-2)}
.leyenda-c i{margin-right:6px;vertical-align:middle}
.tit-lista{padding:16px 20px 0;font-size:18px}
/* ---------- Mi perfil (profe) ---------- */
.aviso-perfil{padding:18px 20px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.estado-perfil{font-size:12.5px;font-weight:650;padding:3px 10px;border-radius:99px;background:var(--papel-2);white-space:nowrap}
.estado-perfil.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.estado-perfil.aviso{background:color-mix(in srgb,var(--aviso) 15%,transparent);color:var(--aviso)}
.estado-perfil.gris{color:var(--tinta-2)}
.perfil-p{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.perfil-form{display:grid;gap:16px}
.sec-pf{padding:22px 24px}
.sec-pf h3{font-size:19px;margin-bottom:14px}
.campos-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.campos-2 .ancho{grid-column:1/-1}
.foto-fila{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.foto-ed{width:96px;height:96px;border-radius:50%;border:3px solid var(--hoja);box-shadow:0 0 0 1px var(--linea-2);display:grid;place-items:center;color:#fff;font-size:28px;font-weight:700;flex:none;cursor:pointer}
.etq-pf{font-weight:650;font-size:14px;margin:4px 0 10px}
.etq-pf+.chips-ed,.etq-pf+.casillas-ed{margin-bottom:16px}
.chips-ed{display:flex;flex-wrap:wrap;gap:8px}
.chip-ed{border:1.5px solid var(--linea-2);background:transparent;color:var(--tinta);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}

<body>
<main class="envoltura panel">
  <aside class="lateral">
    <div class="rol" id="rol" aria-label="Ver el panel como"><button type="button" data-r="familia">Familia</button><button type="button" data-r="profe">Profe</button></div>
    <p class="mono suave" style="font-size:11px;margin-top:6px">Maqueta: cambia de vista para ver los dos paneles</p>
    <nav id="menu"></nav>
  </aside>
  <section id="vista"></section>
</main>

<script src="assets/datos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="assets/supa.js"></script>
<script src="assets/comun.js"></script>
<script src="assets/ia.js"></script>
<script>
D.listo.then(async () => {
  const D = window.D, $ = s => document.querySelector(s);
  const s = U.sesion() || { nombre: 'Marta', rol: 'familia', hijos: [{ nombre: 'Lucas', curso: '3º ESO' }, { nombre: 'Sofía', curso: '6º Primaria' }] };
  let rol = U.param('rol') === 'profe' ? 'profe' : 'familia';
  const hijo = (s.hijos && s.hijos[0]) || { nombre: s.nombre, curso: '' };
  const hoy = new Date();
  const dia = n => { const d = new Date(hoy); d.setDate(hoy.getDate() + n); return d; };
  const fmt = (d, o) => d.toLocaleDateString('es-ES', o);

  // ---------- Datos simulados ----------
  // Las clases de los grupos de estudio no van aquí: salen del calendario de cada grupo (MIS_GRUPOS)
  let PROXIMAS = [
    { profe: 'daniel', quien: hijo.nombre, d: dia(3), hora: '17:00', tipo: 'Clase suelta · 60 min', lugar: 'Online' },
    { profe: 'daniel', quien: hijo.nombre, d: dia(10), hora: '17:00', tipo: 'Bono de 10 · 60 min', lugar: 'Online' }
  ];
  let INFORMES = [
    { profe: 'laura', d: dia(-5), tema: 'Ecuaciones de segundo grado', bien: 'Ya aplica la fórmula sin mirar los apuntes.', cuesta: 'Se lía con los signos al despejar.', luego: 'Problemas con enunciado y repaso de signos.', nivel: [2, 2, 3, 3, 4] },
    { profe: 'daniel', d: dia(-4), tema: 'Present perfect vs past simple', bien: 'Mucho más suelto hablando, sin miedo.', cuesta: 'Los participios irregulares.', luego: 'Lista de 20 irregulares y una redacción corta.', nivel: [3, 3, 3, 4] },
    { profe: 'laura', d: dia(-12), tema: 'Factorización de polinomios', bien: 'Domina el factor común.', cuesta: 'La regla de Ruffini todavía.', luego: 'Ecuaciones de segundo grado.', nivel: [2, 2, 3] }
  ];
  let CHATS = {
    laura: [['ella', 'Hola, Marta. Hoy hemos avanzado mucho con las ecuaciones. Le he dejado 5 ejercicios para el jueves.'], ['yo', '¡Genial, gracias! ¿El martes podríais ver también problemas?'], ['ella', 'Claro, lo preparo.']],
    daniel: [['ella', 'Te confirmo la clase del jueves a las 17:00. El enlace de la videollamada te llega una hora antes.']]
  };
  try { const g = JSON.parse(localStorage.getItem('chats') || 'null'); if (g) CHATS = g; } catch (e) {}
  const guardarChats = () => { try { localStorage.setItem('chats', JSON.stringify(CHATS)); } catch (e) {} };
  let SOLICITUDES = [
    { fam: 'demo-rosa', familia: 'Rosa T.', alumno: 'Iker · 2º ESO', tipo: 'Primera a prueba', cuando: 'Lunes 18:00', zona: '60 min', modalidad: 'presencial' },
    { fam: 'demo-andres', familia: 'Andrés M.', alumno: 'Nora · 1º Bachillerato', tipo: 'Bono de 10', cuando: 'Miércoles 19:00', zona: '90 min', modalidad: 'online' },
    { fam: 'demo-lucia', familia: 'Lucía R.', alumno: 'Plaza en grupo 4º ESO', tipo: 'Grupo de estudio', cuando: 'Martes 18:00', zona: '60 min', modalidad: 'presencial' }
  ];
  let ALUMNOS = [['Familia García · Lucas', 14], ['Familia Pérez · Nora', 4], ['Familia Ruiz · Pablo', 27], ['Familia Soto · Alba', 8]];
  let PAGOS = [[-5, 'Grupo de estudio · Laura', 11.6], [-4, 'Clase suelta · Daniel', 15], [-30, 'Bono 10 clases · Laura', 171], [-34, 'Primera a prueba · Daniel', 15]];
  let GASTOS = [['Grupo de estudio · Laura', 11.6], ['Clase suelta · Daniel', 15]];
  const STATS = { mes: '1.184 €', semana: 9, nota: '★ 4,9', ingresos: [612, 780, 905, 1010, 1102, 1184], proximoPago: '184,30 € a tu cuenta ···· 0817' };

  // ---------- Datos de verdad, si has entrado con una cuenta ----------
  let REAL = false, CLASES = [], yo = null, quitarEscucha = null;
  const CONV = {};
  // Las familias que han escrito o pedido clase al profe (nombre, hijos, zona…), para el chat y las solicitudes
  const FAMILIAS = {};
  const nombreFam = id => FAMILIAS[id] ? `${FAMILIAS[id].nombre || 'Familia'}${FAMILIAS[id].inicial ? ' ' + FAMILIAS[id].inicial + '.' : ''}` : (REAL ? 'Familia' : 'Familia García');
  const hijosFam = id => { const h = FAMILIAS[id] && (FAMILIAS[id].hijos || []).filter(x => x && x.nombre); return h && h.length ? h.map(x => x.nombre + (x.curso ? ' · ' + x.curso : '')).join(', ') : (REAL ? 'Alumno' : 'Lucas · 4º ESO'); };
  const TIPO_TXT = { prueba: 'Primera a prueba', suelta: 'Clase suelta', bono: 'Bono de 10', grupo: 'Grupo de estudio' };
  const persona = id => D.profe(id) || { id, nombre: FAMILIAS[id] ? nombreFam(id) : 'Familia', avatar: FAMILIAS[id] ? FAMILIAS[id].avatar : null, asig: ['mat'], libre: [], responde: '—', precio: 0 };
  const hora = d => d.toTimeString().slice(0, 5);
  if (window.SUPA && (await SUPA.sesionLista) && SUPA.usuario()) {
    REAL = true; rol = SUPA.rol(); yo = SUPA.usuario().id;
    try {
      CLASES = await SUPA.misClases();
      PROXIMAS = CLASES.filter(c => c.familia_id === yo && new Date(c.empieza) >= hoy && ['pedida', 'aceptada'].includes(c.estado)).map(c => {
        const p = persona(c.teacher_id), d = new Date(c.empieza);
        return { profe: c.teacher_id, quien: c.alumno || hijo.nombre, d, hora: hora(d), tipo: `${TIPO_TXT[c.tipo]} · ${c.minutos} min${c.estado === 'pedida' ? ' · esperando respuesta' : ''}`, lugar: p.zona ? D.zona(p.zona).nombre : 'Online' };
      }).filter(c => D.profe(c.profe));
      INFORMES = (await SUPA.misInformes()).map(i => ({ profe: i.teacher_id, familia: i.familia_id, alumno: i.alumno, d: new Date(i.creado), tema: i.tema, bien: i.bien, cuesta: i.cuesta, luego: i.luego, nivel: [i.seguridad || 3] })).filter(i => rol === 'profe' || D.profe(i.profe));
      SOLICITUDES = CLASES.filter(c => c.teacher_id === yo && c.estado === 'pedida').map(c => { const d = new Date(c.empieza); return { id: c.id, fam: c.familia_id, familia: 'Familia', alumno: c.alumno || 'Alumno', tipo: TIPO_TXT[c.tipo], cuando: `${fmt(d, { weekday: 'long', day: 'numeric' })} ${hora(d)}`, zona: c.minutos + ' min', modalidad: c.modalidad }; });
      const porAlumno = {}; CLASES.filter(c => c.teacher_id === yo && c.estado === 'hecha').forEach(c => { const k = c.alumno || 'Alumno'; porAlumno[k] = (porAlumno[k] || 0) + 1; });
      ALUMNOS = Object.entries(porAlumno).map(([n, c]) => ['Familia · ' + n, c]);
      const vivas = CLASES.filter(c => c.familia_id === yo && !['cancelada', 'rechazada'].includes(c.estado));
      PAGOS = vivas.map(c => [Math.round((new Date(c.empieza) - hoy) / 864e5), `${TIPO_TXT[c.tipo]} · ${persona(c.teacher_id).nombre}`, +c.precio]);
      GASTOS = vivas.filter(c => new Date(c.empieza).getMonth() === hoy.getMonth()).map(c => [`${TIPO_TXT[c.tipo]} · ${persona(c.teacher_id).nombre.split(' ')[0]}`, +c.precio]);
      const hechas = CLASES.filter(c => c.teacher_id === yo && c.estado === 'hecha');
      STATS.ingresos = Array.from({ length: 6 }, (_, i) => { const m = new Date(hoy); m.setMonth(hoy.getMonth() - 5 + i); return Math.round(hechas.filter(c => { const d = new Date(c.empieza); return d.getMonth() === m.getMonth() && d.getFullYear() === m.getFullYear(); }).reduce((a, c) => a + c.precio * (1 - c.comision / 100), 0)); });
      STATS.mes = STATS.ingresos[5].toLocaleString('es-ES') + ' €';
      const sem = new Date(hoy); sem.setDate(hoy.getDate() + 7);
      STATS.semana = CLASES.filter(c => c.teacher_id === yo && c.estado === 'aceptada' && new Date(c.empieza) >= hoy && new Date(c.empieza) < sem).length;
      const yoProfe = D.profe(yo); STATS.nota = yoProfe && yoProfe.nota ? '★ ' + U.coma(yoProfe.nota) : 'Nuevo';
      STATS.proximoPago = 'cuando esté activada la pasarela de pago';
      CHATS = {};
      for (const c of await SUPA.conversaciones()) {
        const otro = c.student_id === yo ? c.teacher_id : c.student_id;
        CONV[otro] = c.id;
        CHATS[otro] = (await SUPA.mensajes(c.id)).map(m => [m.sender_id === yo ? 'yo' : 'ella', m.body]);
      }
      // Profe: quién es cada familia (para las solicitudes, el chat y su perfil)
      if (rol === 'profe') {
        const ids = [...new Set([...CLASES.filter(c => c.teacher_id === yo).map(c => c.familia_id), ...Object.keys(CONV)])];
        (await Promise.all(ids.map(id => SUPA.perfilAlumno(id).catch(() => null)))).forEach(f => { if (f) FAMILIAS[f.id] = f; });
        SOLICITUDES.forEach(r => {
          if (!FAMILIAS[r.fam]) return;
          r.familia = nombreFam(r.fam);
          const h = (FAMILIAS[r.fam].hijos || []).find(x => x && x.nombre === r.alumno);
          if (h && h.curso) r.alumno += ' · ' + h.curso;
        });
      }
    } catch (e) { console.warn(e); U.tostada('No se han podido cargar tus datos: ' + e.message); }
    $('#rol').hidden = true; $('#rol').nextElementSibling.hidden = true;
  } else if (D.modo === 'real') {
    // Con profes de verdad en la web, el panel es de tu cuenta: hay que entrar
    location.href = 'entrar.html?volver=' + encodeURIComponent('panel.html' + location.search + location.hash);
    return;
  }

  // ---------- Mi perfil (profe) ----------
  let MI_PERFIL = null;
  if (REAL && rol === 'profe') { try { MI_PERFIL = await SUPA.miPerfilProfe(); } catch (e) { console.warn(e); U.tostada('No se ha podido cargar tu perfil: ' + e.message); } }
  else if (!REAL) {
    // Maqueta: el perfil de Laura
    const p = D.profe('laura') || D.PROFES[0];
    if (p) MI_PERFIL = Object.assign(JSON.parse(JSON.stringify(p)), { estado: 'approved', nombrePila: p.nombre.split(' ')[0], apellidos: p.nombre.split(' ').slice(1).join(' '),
      experiencia: 6, titulacion: (p.estudios || '').split(' · ')[0], centro: (p.estudios || '').split(' · ')[1] || '' });
  }

  // ---------- Tus grupos de estudio ----------
  const leerLS = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? def : v; } catch (e) { return def; } };
  let MIS_GRUPOS = [];
  if (REAL) {
    // Con su calendario (clases canceladas y extra) para pintarlo todo junto
    MIS_GRUPOS = (await Promise.all(D.GRUPOS.filter(g => g.dentro).map(g => SUPA.grupoDetalle(g.id).catch(() => null)))).filter(Boolean);
  } else {
    let unidos = leerLS('grupos', null);
    if (unidos === null) { unidos = D.GRUPOS[0] ? [D.GRUPOS[0].id] : []; try { localStorage.setItem('grupos', JSON.stringify(unidos)); } catch (e) {} }
    const locales = leerLS('gruposCreados', []);
    MIS_GRUPOS = [...locales, ...D.GRUPOS.filter(g => unidos.includes(g.id) && !locales.some(l => l.id === g.id))]
      .map(g => Object.assign({}, g, leerLS('grupoAjustes:' + g.id, {}), { sesiones: leerLS('grupoSesiones:' + g.id, []), creado: g.creado || leerLS('grupoCreado:' + g.id, null) }));
  }

  // ---------- Calendario: clases sueltas + clases de tus grupos ----------
  const DIA_N = { Domingo: 0, Lunes: 1, Martes: 2, 'Miércoles': 3, Jueves: 4, Viernes: 5, 'Sábado': 6 };
  const isoD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const deIso = t => { const [a, m, d] = String(t).slice(0, 10).split('-').map(Number); return new Date(a, m - 1, d); };
  const conHora = (d, h) => { const x = new Date(d), m = /^(\d{1,2}):(\d{2})/.exec(h || ''); x.setHours(m ? +m[1] : 0, m ? +m[2] : 0, 0, 0); return x; };
  const profeGrupo = g => (g.profe && D.profe(g.profe)) || null;
  const nombreProfeGrupo = g => (profeGrupo(g) || g.profeInfo || {}).nombre || '';
  function sesionesGrupo(g, desde, hasta) {
    const out = [], dn = DIA_N[g.dia], ses = g.sesiones || [], hayP = !!(profeGrupo(g) || g.profeInfo);
    // Sin profe las clases aún no han empezado: se enseñan desde hoy como «previstas»
    const inicio = hayP && g.creado ? deIso(g.creado) : deIso(isoD(hoy));
    const base = { tipo: 'grupo', grupo: g, titulo: `${D.asig(g.asig).nombre} · grupo de ${g.curso}`, profe: g.profe, lugar: (D.zona(g.zona) || {}).nombre || '' };
    if (dn != null) {
      const d = new Date(Math.max(desde, inicio)); d.setHours(0, 0, 0, 0);
      while (d.getDay() !== dn) d.setDate(d.getDate() + 1);
      for (; d <= hasta; d.setDate(d.getDate() + 7)) {
        const f = isoD(d), canc = ses.some(x => x.fecha === f && x.estado === 'cancelada');
        out.push({ ...base, d: conHora(d, g.hora), f, hora: g.hora, estado: canc ? 'cancelada' : hayP ? 'clase' : 'prevista' });
      }
    }
    ses.filter(x => x.estado === 'extra').forEach(x => { const d = deIso(x.fecha); if (d >= desde && d <= hasta) out.push({ ...base, d: conHora(d, x.hora || g.hora), f: x.fecha, hora: x.hora || g.hora, estado: 'extra' }); });
    return out;
  }
  // Clases sueltas, a prueba y de bono
  const SUELTAS = (REAL
    ? CLASES.filter(c => c.familia_id === yo && !['cancelada', 'rechazada'].includes(c.estado)).map(c => { const d = new Date(c.empieza); return { d, hora: hora(d), profe: c.teacher_id, tipoTxt: `${TIPO_TXT[c.tipo]} · ${c.minutos} min`, estado: c.estado === 'pedida' ? 'pedida' : 'clase' }; })
    : PROXIMAS.map(c => ({ d: conHora(c.d, c.hora), hora: c.hora, profe: c.profe, tipoTxt: c.tipo, estado: 'clase', lugar: c.lugar })))
    .filter(c => D.profe(c.profe))
    .map(c => { const p = D.profe(c.profe); return { ...c, tipo: 'clase', f: isoD(c.d), titulo: `${D.asig(p.asig[0]).nombre} con ${p.nombre}`, lugar: c.lugar || (p.zona ? D.zona(p.zona).nombre : 'Online') }; });
  // Profe: sus clases con cada familia (pendientes de aceptar, aceptadas y hechas)
  function clasesDelProfe() {
    if (REAL) return CLASES.filter(c => c.teacher_id === yo && ['pedida', 'aceptada', 'hecha'].includes(c.estado)).map(c => {
      const d = new Date(c.empieza);
      return { id: c.id, d, f: isoD(d), hora: hora(d), tipo: 'clase', vistaProfe: true, fam: c.familia_id, titulo: `${c.alumno || 'Alumno'} · ${TIPO_TXT[c.tipo]}`, tipoTxt: `${c.minutos} min`,
        alumno: c.alumno || 'Alumno', tipoNombre: TIPO_TXT[c.tipo], minutos: c.minutos || 60, precio: +c.precio || 0,
        lugar: c.modalidad === 'online' ? 'Online' : c.modalidad === 'presencial' ? 'En persona' : '', estado: c.estado === 'pedida' ? 'sinAceptar' : c.estado === 'hecha' ? 'hecha' : 'clase' };
    });
    // Maqueta
    return [[1, '18:00', 'Lucas · Grupo de estudio 4º ESO', 'En persona', 'clase'], [2, '17:00', 'Iker · Primera a prueba', 'En persona', 'sinAceptar'], [4, '19:00', 'Nora · Bono de 10', 'Online', 'clase'],
      [8, '18:00', 'Lucas · Grupo de estudio 4º ESO', 'En persona', 'clase'], [-2, '18:00', 'Pablo · Clase suelta', 'En persona', 'hecha']].map(([n, h, t, l, e], i) => {
      const d = conHora(dia(n), h), [alumno, tipoNombre] = t.split(' · ');
      return { id: 'demo-' + i, d, f: isoD(d), hora: h, tipo: 'clase', vistaProfe: true, fam: null, titulo: t, tipoTxt: '60 min', alumno, tipoNombre, minutos: 60, precio: 18, lugar: l, estado: e };
    });
  }

  // ---------- Inicio del profe: la agenda, con la semana arriba y cada clase desplegable ----------
  const EN_LETRA = ['ninguna', 'una', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez'];
  const horaFin = e => hora(new Date(e.d.getTime() + (e.minutos || 60) * 60e3));
  const finEv = e => e.d.getTime() + (e.minutos || 60) * 60e3;
  const eurTxt = n => (Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ',')) + ' €';
  let iniDia = null, iniAbierta = null; // día que se está mirando (AAAA-MM-DD) y clase desplegada

  function fraseDelDia(ahora) {
    const hoyF = isoD(ahora), deHoy = eventos(deIso(hoyF), deIso(hoyF)).filter(e => e.estado !== 'cancelada');
    if (!deHoy.length) {
      const sig = proximosEv(1)[0];
      return sig ? `Hoy no tienes clases. La siguiente es el ${fmt(sig.d, { weekday: 'long', day: 'numeric' })} a las ${cuandoEv(sig)}, con ${U.esc(sig.alumno || 'tu alumno')}.`
        : 'Hoy no tienes clases. Cuando aceptes una solicitud, tu día aparecerá aquí.';
    }
    const n = deHoy.length, cuantas = `${may(EN_LETRA[n] || String(n))} ${n === 1 ? 'clase' : 'clases'} hoy.`;
    const enCurso = deHoy.find(e => e.d <= ahora && finEv(e) > ahora.getTime()), sig = deHoy.find(e => e.d > ahora);
    if (enCurso) {
      const quedan = Math.round((finEv(enCurso) - ahora) / 60e3);
      return `${cuantas} Ahora estás con ${U.esc(enCurso.alumno)}; ${quedan <= 1 ? 'termina ya' : `quedan ${quedan} min`}.`;
    }
    if (sig) {
      const min = Math.round((sig.d - ahora) / 60e3);
      const cuando = min < 1 ? 'empieza ya' : min <= 90 ? `empieza en ${min} min` : `a las ${cuandoEv(sig)}`;
      return `${cuantas} La siguiente, ${U.esc(sig.alumno)}, ${cuando}${sig.lugar === 'Online' ? ' (online)' : ''}.`;
    }
    return `${cuantas} Ya has terminado por hoy.`;
  }

  // Lo que se ve al desplegar una clase
  function detalleClase(e, pasada) {
    const fam = e.fam && FAMILIAS[e.fam];
    const hijo = fam && (fam.hijos || []).find(h => h && h.nombre === e.alumno);
    const inf = e.fam ? INFORMES.filter(i => i.familia === e.fam && (!i.alumno || i.alumno === e.alumno)).sort((a, b) => b.d - a.d)[0] : null;
    const datos = [
      hijo && hijo.curso ? ['Curso', U.esc(hijo.curso)] : null,
      fam ? ['Familia', U.esc(nombreFam(e.fam))] : null,
      ['Dónde', e.lugar === 'Online' ? 'Online, por videollamada' : e.lugar ? 'En persona' + (fam && fam.zona && D.zona(fam.zona) ? `, por ${D.zona(fam.zona).nombre}` : '') : 'Por concretar'],
      e.precio ? ['Precio', eurTxt(e.precio)] : null,
      inf ? ['Último informe', `${U.esc(inf.tema)}: le cuesta ${U.esc(inf.cuesta.replace(/\.$/, '').toLowerCase())}`] : null
    ].filter(Boolean);
    const b = (txt, attrs, pri) => `<button type="button" class="boton ${pri ? '' : 'sec'} peq" ${attrs}>${txt}</button>`;
    const acciones = e.estado === 'sinAceptar'
      ? b('Aceptar', `data-clase-acepta="${e.id}"`, true) + b('Rechazar', `data-clase-rechaza="${e.id}"`)
      : pasada ? b('Escribir el informe', 'data-ir="informe"', true) + (e.fam ? b('Escribir a la familia', `data-escribir-fam="${e.fam}"`) : '')
      : b('Preparar la clase', `data-ini-preparar="${e.id}"`, true) + (e.fam ? b('Escribir a la familia', `data-escribir-fam="${e.fam}"`) : b('Escribir', 'data-ir="mensajes"'));
    return `<dl class="ag-datos">${datos.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
      <p class="ag-botones">${acciones}${e.fam ? `<button type="button" class="ag-accion" data-perfil-fam="${e.fam}">Ver perfil del alumno</button>` : ''}</p>`;
  }

  function vistaInicioProfe() {
    const ahora = new Date(), hoyF = isoD(ahora); if (!iniDia) iniDia = hoyF;
    const h = ahora.getHours(), saludo = h < 14 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches';
    const nombre = U.esc((REAL ? s.nombre : 'Laura') || '');
    const diaSel = deIso(iniDia), esHoy = iniDia === hoyF;
    const manana = new Date(ahora); manana.setDate(manana.getDate() + 1);

    // La semana del día que se mira, con un punto por clase
    const lunes = new Date(diaSel); lunes.setDate(lunes.getDate() - (lunes.getDay() + 6) % 7);
    const dias = Array.from({ length: 7 }, (_, i) => { const d = new Date(lunes); d.setDate(lunes.getDate() + i); return d; });
    const evSem = eventos(dias[0], dias[6]).filter(e => e.estado !== 'cancelada');
    const chips = dias.map(d => {
      const f = isoD(d), n = evSem.filter(e => e.f === f).length;
      return `<button type="button" class="dia-chip ${f === iniDia ? 'sel' : ''} ${f === hoyF ? 'hoy' : ''} ${f < hoyF ? 'pasado' : ''}" data-ini-dia="${f}" aria-pressed="${f === iniDia}" aria-label="${fmt(d, { weekday: 'long', day: 'numeric' })}: ${n} ${n === 1 ? 'clase' : 'clases'}">
        <span>${fmt(d, { weekday: 'short' }).replace('.', '')}</span><b>${d.getDate()}</b><i>${'<em></em>'.repeat(Math.min(n, 4))}</i></button>`;
    }).join('');
    const mismaSemana = dias.some(d => isoD(d) === hoyF);

    // Agenda del día elegido
    const delDia = eventos(diaSel, diaSel).filter(e => e.estado !== 'cancelada');
    let raya = false;
    const filas = delDia.map(e => {
      let pre = '';
      if (esHoy && !raya && e.d > ahora) { raya = true; if (delDia[0].d < ahora) pre = `<li class="ag-ahora" aria-label="Ahora"><span>${hora(ahora)}</span></li>`; }
      const pasada = finEv(e) <= ahora.getTime(), ya = esHoy && e.d <= ahora && !pasada, k = String(e.id), abierta = iniAbierta === k;
      const detalle = [e.tipoNombre, `${e.minutos || 60} min`, e.lugar ? e.lugar.toLowerCase() : ''].filter(Boolean).join(' · ');
      const nota = e.estado === 'sinAceptar' ? '<span class="ag-nota">por confirmar</span>' : ya ? '<span class="ag-nota ya">ahora</span>' : e.estado === 'hecha' ? '<span class="ag-nota hecha">hecha</span>' : '';
      return `${pre}<li class="ag-item ${pasada ? 'pasada' : ''} ${ya ? 'ya' : ''} ${e.estado === 'sinAceptar' ? 'por-confirmar' : ''} ${abierta ? 'abierta' : ''}">
        <time>${U.esc(cuandoEv(e))}<small>${horaFin(e)}</small></time>
        <button type="button" class="ag-fila" data-ini-clase="${k}" aria-expanded="${abierta}"><span><b>${U.esc(e.alumno)}</b> ${nota}<small>${U.esc(detalle)}</small></span><i class="ag-flecha" aria-hidden="true"></i></button>
        <div class="ag-det"><div>${detalleClase(e, pasada)}</div></div></li>`;
    }).join('');
    const titDia = esHoy ? 'Hoy' : iniDia === isoD(manana) ? 'Mañana' : may(fmt(diaSel, { weekday: 'long', day: 'numeric', month: 'long' }));
    const vacio = esHoy ? 'Hoy no tienes nada en la agenda.' : iniDia < hoyF ? 'Ese día no tuviste clases.' : 'Ese día no tienes clases.';

    // Por responder: se acepta o se rechaza aquí mismo
    const pend = SOLICITUDES.slice(0, 4).map((r, i) => `<li><span><b>${U.esc(r.alumno.split(' · ')[0])}</b> ${U.esc(r.tipo.toLowerCase())}<small>${U.esc(r.cuando)}${r.modalidad ? (r.modalidad === 'online' ? ' · online' : ' · en persona') : ''}</small></span>
      <span class="sol-botones"><button type="button" class="sol-si" data-sol-acepta="${i}" aria-label="Aceptar">Aceptar</button><button type="button" class="sol-no" data-sol-rechaza="${i}" aria-label="Rechazar">✕</button></span></li>`).join('');
    const estadoPerfil = MI_PERFIL ? ({ approved: 'publicada', pending: 'pendiente de revisión', paused: 'en pausa', rejected: 'sin aprobar' })[MI_PERFIL.estado] || MI_PERFIL.estado : null;

    return `<div class="ini-profe">
      <header class="ini-cab"><p>${may(fmt(ahora, { weekday: 'long', day: 'numeric', month: 'long' }))}</p><h1>${saludo}, ${nombre}</h1><p class="ini-frase" id="iniFrase">${fraseDelDia(ahora)}</p></header>
      <div class="semana-ini">
        <button type="button" class="sem-flecha" data-ini-sem="-1" aria-label="Semana anterior">‹</button>
        <div class="sem-dias">${chips}</div>
        <button type="button" class="sem-flecha" data-ini-sem="1" aria-label="Semana siguiente">›</button>
      </div>
      <div class="ini-cols">
        <section class="ini-agenda" aria-label="Clases del día">
          <div class="ini-tit"><h2>${titDia}</h2>${esHoy ? `<button type="button" class="ag-accion" data-ir="calendario">Ver el mes</button>` : `<button type="button" class="ag-accion" data-ini-dia="${hoyF}">Volver a hoy</button>`}</div>
          ${delDia.length ? `<ol class="agenda">${filas}</ol>` : `<p class="ini-vacio">${vacio}</p>`}
          ${!mismaSemana ? '' : ''}
        </section>
        <aside class="ini-lado">
          <section><div class="ini-tit"><h2>Por responder</h2>${SOLICITUDES.length > 4 ? `<button type="button" class="ag-accion" data-ir="solicitudes">Ver todas</button>` : ''}</div>
            ${SOLICITUDES.length ? `<ul class="ini-lista sol">${pend}</ul>` : '<p class="ini-vacio">Nada pendiente. Las nuevas solicitudes te llegarán aquí.</p>'}
            ${REAL ? '' : '<p class="ini-vacio" style="margin-top:10px">Falta el informe de la clase de ayer con Lucas. <button type="button" class="ag-accion" data-ir="informe">Escribirlo</button></p>'}</section>
          <section><div class="ini-tit"><h2>Este mes</h2><button type="button" class="ag-accion" data-ir="ingresos">Ingresos</button></div>
            <dl class="ini-datos"><div><dt>Te llegan</dt><dd>${STATS.mes}</dd></div><div><dt>Clases esta semana</dt><dd>${STATS.semana}</dd></div><div><dt>Alumnos</dt><dd>${ALUMNOS.length}</dd></div><div><dt>Valoración</dt><dd>${STATS.nota === 'Nuevo' ? 'sin reseñas' : STATS.nota}</dd></div></dl></section>
          ${estadoPerfil ? `<p class="ini-perfil">Tu ficha está <b>${estadoPerfil}</b>. <button type="button" class="ag-accion" data-ir="perfil">Editarla</button></p>` : ''}
        </aside>
      </div></div>`;
  }
  // Vuelve a pintar el inicio sin la animación de entrada (al cambiar de día, cada minuto…)
  function repintarInicio() {
    if (rol !== 'profe' || actual !== 'inicio') return;
    const v = document.querySelector('#vista .vista'); if (!v) return;
    v.innerHTML = vistaInicioProfe();
  }
  // La hora de «ahora» y la frase del día se actualizan solas
  setInterval(() => { if (!document.hidden) repintarInicio(); }, 60e3);
  async function responderSolicitudIni(i, ok) {
    const r = SOLICITUDES[i]; if (!r) return;
    if (REAL && r.id) {
      try { await SUPA.cambiarClase(r.id, ok ? 'aceptada' : 'rechazada'); } catch (x) { return U.tostada(x.message); }
      const c = CLASES.find(x => x.id === r.id); if (c) c.estado = ok ? 'aceptada' : 'rechazada';
    }
    SOLICITUDES.splice(i, 1); menu(); repintarInicio();
    U.tostada(ok ? `Aceptada: ${r.alumno.split(' · ')[0]}, ${r.cuando}. Ya está en tu agenda.` : 'Solicitud rechazada');
  }
  async function cambiarClaseIni(id, ok) {
    const i = SOLICITUDES.findIndex(r => String(r.id) === String(id));
    if (i >= 0) return responderSolicitudIni(i, ok);
    if (REAL) { try { await SUPA.cambiarClase(id, ok ? 'aceptada' : 'rechazada'); } catch (x) { return U.tostada(x.message); } const c = CLASES.find(x => x.id === id); if (c) c.estado = ok ? 'aceptada' : 'rechazada'; }
    repintarInicio(); U.tostada(ok ? 'Clase aceptada' : 'Clase rechazada');
  }
  function eventos(desde, hasta) {
    const fin = new Date(hasta); fin.setHours(23, 59, 59, 999);
    if (rol === 'profe') return clasesDelProfe().filter(e => e.d >= desde && e.d <= fin).sort((a, b) => a.d - b.d);
    return [...SUELTAS.filter(e => e.d >= desde && e.d <= fin), ...MIS_GRUPOS.flatMap(g => sesionesGrupo(g, desde, hasta))].sort((a, b) => a.d - b.d);
  }
  function proximosEv(n) {
    const desde = new Date(hoy); desde.setHours(0, 0, 0, 0); const hasta = new Date(desde); hasta.setDate(hasta.getDate() + 90);
    const ya = new Date(hoy.getTime() - 3600e3);
    return eventos(desde, hasta).filter(e => e.estado !== 'cancelada' && e.d >= ya).slice(0, n);
  }
  const ESTADO_EV = { clase: '', prevista: 'pendiente de profe', extra: 'clase extra', cancelada: 'cancelada', pedida: 'esperando respuesta del profe', sinAceptar: 'sin aceptar', hecha: 'hecha' };
  const cuandoEv = e => (e.hora && e.hora !== 'Por decidir' ? e.hora : 'hora por decidir');
  const accionEv = (e, sec = true) => e.vistaProfe
    ? (e.estado === 'sinAceptar' ? `<button class="boton ${sec ? 'sec' : ''} peq" type="button" data-ir="solicitudes">Ver solicitud</button>` : e.fam ? `<button class="boton ${sec ? 'sec' : ''} peq" type="button" data-escribir-fam="${e.fam}">Escribir</button>` : `<button class="boton ${sec ? 'sec' : ''} peq" type="button" data-ir="mensajes">Escribir</button>`)
    : e.tipo === 'grupo'
    ? `<a class="boton ${sec ? 'sec' : ''} peq" href="grupo.html?id=${encodeURIComponent(e.grupo.id)}">Abrir el grupo</a>`
    : `<button class="boton ${sec ? 'sec' : ''} peq" type="button" data-chat="${e.profe}">Escribir a ${U.esc(D.profe(e.profe).nombre.split(' ')[0])}</button>`;
  const filaEvento = e => `<div class="fila-clase ${e.estado === 'cancelada' ? 'tachada' : ''}">
      <div class="fecha"><span>${fmt(e.d, { weekday: 'short' })}</span><b>${e.d.getDate()}</b></div>
      <div><b>${U.esc(e.titulo)}</b><p class="suave" style="font-size:14px">${fmt(e.d, { day: 'numeric', month: 'long' })} · ${U.esc(cuandoEv(e))} · ${e.tipo === 'grupo' ? 'Grupo de estudio' : U.esc(e.tipoTxt)}${e.lugar ? ' · ' + U.esc(e.lugar) : ''}${ESTADO_EV[e.estado] ? ` <span class="estado-ev ${e.estado}">${ESTADO_EV[e.estado]}</span>` : ''}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${accionEv(e)}</div></div>`;

  // Los profes con los que tienes algo: clases, grupos, informes o conversación
  const MIS_PROFES = [...new Set([...SUELTAS.map(e => e.profe), ...MIS_GRUPOS.map(g => g.profe), ...INFORMES.map(i => i.profe), ...Object.keys(CHATS)])].filter(id => id && D.profe(id));

  // ---------- Menús ----------
  const MENUS = {
    familia: [['inicio', 'Inicio'], ['calendario', 'Calendario'], ['profes', 'Mis profes', MIS_PROFES.length], ['grupos', 'Mis grupos', MIS_GRUPOS.length], ['mensajes', 'Mensajes', REAL ? 0 : 1], ['informes', 'Informes', INFORMES.length], ['asistente', 'Asistente'], ['pagos', 'Pagos y bonos'], ['ajustes', 'Ajustes']],
    // Con cuenta de profe, Inicio, Calendario, Mensajes y Perfil van en la cabecera y se ven solos;
    // el menú lateral («Mi panel») tiene el resto. En la maqueta se deja todo en el lateral.
    profe: REAL
      ? [['solicitudes', 'Solicitudes', SOLICITUDES.length], ['preparar', 'Preparar clase'], ['informe', 'Escribir informe'], ['alumnos', 'Mis alumnos'], ['ingresos', 'Ingresos'], ['ajustes', 'Ajustes']]
      : [['inicio', 'Inicio'], ['calendario', 'Calendario'], ['perfil', 'Mi perfil'], ['preparar', 'Preparar clase'], ['solicitudes', 'Solicitudes', SOLICITUDES.length], ['mensajes', 'Mensajes'], ['informe', 'Informe pendiente', 1], ['alumnos', 'Mis alumnos'], ['ingresos', 'Ingresos'], ['ajustes', 'Ajustes']]

  let calMes = null, calDia = null;
  function vistaCalendario() {
    if (!calMes) { const p = proximosEv(1)[0]; calMes = new Date(p ? p.d : hoy); calMes.setDate(1); calMes.setHours(0, 0, 0, 0); }
    const m = calMes, primero = new Date(m.getFullYear(), m.getMonth(), 1), ultimo = new Date(m.getFullYear(), m.getMonth() + 1, 0);
    const por = {}; eventos(primero, ultimo).forEach(e => (por[e.f] = por[e.f] || []).push(e));
    const hoyF = isoD(hoy); let celdas = '';
    for (let i = 0; i < (primero.getDay() + 6) % 7; i++) celdas += '<span class="cdia fuera"></span>';
    for (let d = 1; d <= ultimo.getDate(); d++) {
      const f = isoD(new Date(m.getFullYear(), m.getMonth(), d)), es = por[f] || [];

    }
    const delDia = calDia ? eventos(deIso(calDia), deIso(calDia)) : null, lista = proximosEv(8);
    const esP = rol === 'profe';

          <div class="cal-sem">${['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'].map(x => `<span>${x}</span>`).join('')}</div>
          <div class="cal-rej">${celdas}</div>

        <div style="min-width:0">${delDia ? `<div class="hoja" style="margin-bottom:16px"><h3 class="tit-lista">${may(fmt(deIso(calDia), { weekday: 'long', day: 'numeric', month: 'long' }))}</h3>${delDia.length ? delDia.map(filaEvento).join('') : '<p class="suave" style="padding:10px 20px 18px">Este día no tienes clase.</p>'}</div>` : ''}
          <div class="hoja"><h3 class="tit-lista">Próximas clases</h3>${lista.length ? lista.map(filaEvento).join('') : esP ? '<p class="suave" style="padding:10px 20px 18px">No tienes clases por delante. Cuando aceptes una solicitud, saldrá aquí.</p>' : `<p class="suave" style="padding:10px 20px 18px">No tienes clases. <a href="buscar.html">Busca profe</a> o <a href="grupos.html">únete a un grupo</a>.</p>`}</div></div>

  // ---------- Preparar clase (profe con cuenta): sus clases de verdad y lo que dicen sus informes ----------
  let claseSel = null;
  const clasesPorDelante = () => CLASES.filter(c => c.teacher_id === yo && ['aceptada', 'pedida'].includes(c.estado) && new Date(c.empieza) >= new Date(hoy.getTime() - 3 * 3600e3))
    .sort((a, b) => new Date(a.empieza) - new Date(b.empieza));
  function preparaReal() {
    const lista = clasesPorDelante();
    if (!lista.length) return `<div class="hoja" style="padding:24px;margin-bottom:18px"><b>Aún no tienes clases por delante</b>
      <p class="suave" style="margin-top:6px">Cuando aceptes una solicitud, aquí podrás elegir cada clase y ver lo que le cuesta al alumno según tus informes, con una propuesta para organizar la hora. Mientras, puedes generar ejercicios aquí abajo.</p>
      <p style="margin-top:12px"><button class="boton sec peq" type="button" data-ir="solicitudes">Ver solicitudes</button></p></div>`;
    const c = lista.find(x => x.id === claseSel) || lista[0], d = new Date(c.empieza), quien = c.alumno || 'tu alumno';
    // Lo último que escribiste sobre esa familia
    const inf = INFORMES.filter(i => i.familia === c.familia_id && (!c.alumno || !i.alumno || i.alumno === c.alumno)).sort((a, b) => b.d - a.d)[0];
    const min = c.minutos || 60, t = p => Math.max(5, Math.round(min * p / 5) * 5);
    const estructura = inf
      ? [[t(.17), `Repaso rápido de lo que le cuesta: ${U.esc(inf.cuesta.replace(/\.$/, '').toLowerCase())}.`], [t(.42), `Lo que dejaste para hoy: ${U.esc(inf.luego.replace(/\.$/, '').toLowerCase())}.`], [t(.25), `Que lo haga ${U.esc(quien)} solo; tú solo miras y corriges al final.`], [t(.16), 'Resumen, deberes y apuntar el informe de la clase.']]

    return `<div class="hoja" style="padding:24px;margin-bottom:18px">
        <label class="campo"><span>¿Qué clase vas a preparar?</span><select class="entrada" id="prepClase">${lista.map(x => { const dx = new Date(x.empieza);
          return `<option value="${x.id}" ${x === c ? 'selected' : ''}>${fmt(dx, { weekday: 'long', day: 'numeric', month: 'short' })} · ${hora(dx)} · ${U.esc(x.alumno || 'Alumno')} · ${TIPO_TXT[x.tipo]}${x.estado === 'pedida' ? ' (sin aceptar)' : ''}</option>`; }).join('')}</select></label>
        <p style="font-size:14px;font-weight:600;color:var(--butano);margin-top:18px"><span class="punto-ia"></span>${U.esc(quien)} · ${may(fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }))} a las ${hora(d)} · ${min} min${c.estado === 'pedida' ? ' · aún sin aceptar' : ''}</p>
        ${inf ? `<p style="font-size:18px;margin-top:10px;letter-spacing:-.01em">En tu último informe (${fmt(inf.d, { day: 'numeric', month: 'long' })}, «${U.esc(inf.tema)}») apuntaste que le cuesta <b>${U.esc(inf.cuesta.replace(/\.$/, '').toLowerCase())}</b> y que tocaba <b>${U.esc(inf.luego.replace(/\.$/, '').toLowerCase())}</b>.</p>`
          : `<p style="font-size:18px;margin-top:10px;letter-spacing:-.01em">Es vuestra primera clase: todavía no hay informes de ${U.esc(quien)}. Dedica el principio a ver su nivel.</p>`}

  let PF = null, PF0 = '';   // copia que se edita y cómo estaba al abrirla

    return `<h1>Mi perfil</h1><p class="suave" style="margin:-10px 0 22px">Cambia lo que quieras: a la derecha ves cómo te verán las familias.</p>

          <label class="campo" id="pfZonaCampo" style="margin-top:14px" ${PF.modo === 'online' ? 'hidden' : ''}><span>Tu barrio <span class="suave">(las familias solo ven la zona aproximada)</span></span><select class="entrada" name="zona"><option value="">Elige tu barrio…</option>${zonas}</select></label></section>

      const pl = IA.plan({ asig: 'mat', fecha: f, horas: 3, temas: temas.length ? temas : ['Repaso general'] });
      return { txt: `Hasta el examen del ${DIAS_L(f)} quedan ${pl.dias} días. Te propongo esto${INFORMES.length ? ', empezando por lo que más le cuesta según sus profes' : ''}:`,

    }
    if (/gast|pagad|dinero|cuanto llevamos/.test(t)) {

      const tot = GASTOS.reduce((a, g) => a + g[1], 0);
      return { txt: `Este mes lleváis ${tot.toFixed(2).replace('.', ',')} € en ${GASTOS.length} ${GASTOS.length === 1 ? 'clase' : 'clases'}.`,
        extra: `<table class="mini-tabla">${GASTOS.map(g => `<tr><td>${U.esc(g[0])}</td><td>${g[1].toFixed(2).replace('.', ',')} €</td></tr>`).join('')}<tr><td>Total</td><td>${tot.toFixed(2).replace('.', ',')} €</td></tr></table>` };
    }
    if (/proxima|cuando|a que hora/.test(t)) {
      const ev = proximosEv(2);

        };
      }
      const fc = $('#ajCorreo');
      if (fc) fc.onsubmit = e => { e.preventDefault(); const nuevo = fc.correo.value.trim().toLowerCase();
        if (!/^\S+@\S+\.\S+$/.test(nuevo)) return U.tostada('Escribe un correo válido');
        if (nuevo === SUPA.correo()) return U.tostada('Ese ya es tu correo');
        conBoton(fc, async () => { await SUPA.cambiarCorreo(nuevo); fc.reset(); U.tostada('Te hemos mandado un enlace para confirmar el cambio. Hasta entonces entras con el correo de siempre.'); }); };
      const fk = $('#ajClave');
      if (fk) fk.onsubmit = e => { e.preventDefault();
        if (fk.clave.value.length < 8) return U.tostada('La contraseña necesita al menos 8 caracteres');
        if (fk.clave.value !== fk.clave2.value) return U.tostada('Las dos contraseñas no coinciden');
        conBoton(fk, async () => { await SUPA.cambiarClave(fk.clave.value); fk.reset(); U.tostada('Contraseña cambiada'); }); };
      // Avisos: se guardan solos
      let tAvisos = null;
      document.querySelector('.avisos-aj').onchange = () => {
        clearTimeout(tAvisos);
        tAvisos = setTimeout(async () => {
          const avisos = Object.fromEntries([...document.querySelectorAll('[data-aviso]')].map(i => [i.dataset.aviso, i.checked]));
          try { await guardarCuenta({ avisos }); U.tostada('Avisos guardados'); } catch (x) { U.tostada(x.message); }
        }, 400);
      };
      document.querySelector('.seg-tema').onclick = e => {
        const b = e.target.closest('[data-tema]'); if (!b) return; const t = b.dataset.tema;
        try { t === 'auto' ? localStorage.removeItem('tema') : localStorage.setItem('tema', t); } catch (x) {}
        const aplicar = () => { if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; };
        document.startViewTransition ? document.startViewTransition(aplicar) : aplicar();
        document.querySelectorAll('[data-tema]').forEach(x => x.setAttribute('aria-pressed', x === b));
      };
      $('#ajDescargar').onclick = async e => {
        const b = e.target; b.disabled = true; b.textContent = 'Preparando…';
        try {
          const datos = REAL ? await SUPA.misDatos() : { exportado: new Date().toISOString(), maqueta: true, cuenta: cuenta(), sesion: s };
          const url = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' }));
          const a = document.createElement('a'); a.href = url; a.download = `mis-datos-clasuno-${isoD(hoy)}.json`; document.body.append(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          U.tostada('Descargado: mis-datos-clasuno.json');
        } catch (x) { U.tostada('No se han podido preparar tus datos: ' + x.message); }
        b.disabled = false; b.textContent = 'Descargar';
      };
      $('#ajBorrar').onclick = async () => {
        if (!confirm('¿Pedir que borremos tu cuenta? Te escribiremos al correo de tu cuenta para confirmarlo antes de borrar nada.')) return;
        if (REAL) { try { await SUPA.soporte(SUPA.correo(), `Solicitud de borrado de cuenta (${rol}) · id ${yo}`); } catch (x) { return U.tostada(x.message); } }
        U.tostada('Petición enviada. Te escribiremos para confirmarlo; tienes la respuesta en menos de 30 días.');
      };
      $('#salir').onclick = async () => { if (REAL) { try { await SUPA.salir(); } catch (e) {} } try { localStorage.removeItem('sesion'); } catch (e) {} location.href = 'index.html'; };
      const st = $('#salirTodo');
      if (st) st.onclick = async () => { if (!confirm('Se cerrará tu sesión en este y en todos tus dispositivos. ¿Seguir?')) return; try { await SUPA.salirDeTodo(); } catch (e) {} location.href = 'index.html'; };
    }
  };
  // Delegación general
  $('#vista').addEventListener('click', e => {
    const c = e.target.closest('[data-chat]'); if (c) { chatPedido = c.dataset.chat; return ir('mensajes'); }
    // Inicio del profe: semana, día, clases desplegables y solicitudes
    const idia = e.target.closest('[data-ini-dia]'); if (idia) { iniDia = idia.dataset.iniDia; iniAbierta = null; return repintarInicio(); }
    const isem = e.target.closest('[data-ini-sem]'); if (isem) { const d = deIso(iniDia || isoD(new Date())); d.setDate(d.getDate() + 7 * Number(isem.dataset.iniSem)); iniDia = isoD(d); iniAbierta = null; return repintarInicio(); }
    const icl = e.target.closest('[data-ini-clase]');
    if (icl) {
      const k = icl.dataset.iniClase, li = icl.closest('.ag-item'), abrir = iniAbierta !== k;
      document.querySelectorAll('.ag-item.abierta').forEach(x => { x.classList.remove('abierta'); x.querySelector('.ag-fila').setAttribute('aria-expanded', 'false'); });
      iniAbierta = abrir ? k : null;
      if (abrir) { li.classList.add('abierta'); icl.setAttribute('aria-expanded', 'true'); }
      return;
    }
    const iprep = e.target.closest('[data-ini-preparar]'); if (iprep) { claseSel = iprep.dataset.iniPreparar; return ir('preparar'); }
    const sa = e.target.closest('[data-sol-acepta]'); if (sa) return responderSolicitudIni(+sa.dataset.solAcepta, true);
    const sr = e.target.closest('[data-sol-rechaza]'); if (sr) { if (!confirm('¿Rechazar esta solicitud?')) return; return responderSolicitudIni(+sr.dataset.solRechaza, false); }
    const ca = e.target.closest('[data-clase-acepta]'); if (ca) return cambiarClaseIni(ca.dataset.claseAcepta, true);
    const cr = e.target.closest('[data-clase-rechaza]'); if (cr) { if (!confirm('¿Rechazar esta clase?')) return; return cambiarClaseIni(cr.dataset.claseRechaza, false); }
    // Profe: perfil de la familia y empezar el chat
    const pf = e.target.closest('[data-perfil-fam]'); if (pf) return abrirPerfilFamilia(pf.dataset.perfilFam);
    const ef = e.target.closest('[data-escribir-fam]'); if (ef) return escribirFamilia(ef.dataset.escribirFam);
    // Calendario
    const cm = e.target.closest('[data-cmes]'); if (cm) { calMes.setMonth(calMes.getMonth() + Number(cm.dataset.cmes)); return ir('calendario', true); }
    const cd = e.target.closest('[data-cdia]'); if (cd) { calDia = cd.dataset.cdia; return ir('calendario', true); }
    const ed = e.target.closest('[data-ev-dia]'); if (ed) { calDia = ed.dataset.evDia; calMes = deIso(calDia); calMes.setDate(1); return ir('calendario'); }
    const v = e.target.closest('[data-ir]'); if (v) return ir(v.dataset.ir);
    const pq = e.target.closest('[data-pregunta]'); if (pq) { preguntaPendiente = pq.dataset.pregunta; return ir('asistente'); }
    const sg = e.target.closest('[data-sug]');
    if (sg) {
      const fila = sg.closest('.fila-clase'); const r = SOLICITUDES[+sg.dataset.sug];
      if (fila.nextElementSibling && fila.nextElementSibling.classList.contains('sugerida')) return fila.nextElementSibling.remove();
      const nombre = r.alumno.split(' · ')[0], fam = r.familia.split(' ')[0], cuando = r.cuando.toLowerCase().replace(/ (\d)/, ' a las $1');
      const txt = r.tipo === 'Grupo de estudio' ? `Hola, ${fam}. ¡Bienvenidos al grupo de 4º ESO! Nos vemos los ${cuando.replace('martes', 'martes')} en Chamberí. La primera clase hago un repaso de ecuaciones para ver el nivel de todos.`
        : r.tipo === 'Bono de 10' ? `Hola, ${fam}. Encantada de dar clase a ${nombre}. El ${cuando} me va bien. En la primera vemos qué temas lleva peor y organizo el bono a partir de ahí.`
        : `Hola, ${fam}. Me viene bien el ${cuando}. En esta primera clase a prueba veo cómo va ${nombre} y os cuento qué plan le propongo. Si no os convence, no la pagáis.`;
      fila.insertAdjacentHTML('afterend', `<div class="sugerida"><p></p><button class="boton peq" type="button" onclick="this.closest('.sugerida').remove();U.tostada('Respuesta enviada y clase aceptada')">Enviar y aceptar</button> <button class="boton sec peq" type="button" onclick="U.tostada('Copiada para editarla en el chat')">Editar</button></div>`);
      IA.escribir(fila.nextElementSibling.querySelector('p'), txt, 8);
      return;
    }
    const a = e.target.closest('[data-acepta],[data-otra]');
    if (a && REAL) {
      const fila0 = a.closest('.fila-clase'), r0 = SOLICITUDES[+fila0.dataset.i];
      if (r0 && r0.id) { SUPA.cambiarClase(r0.id, a.hasAttribute('data-acepta') ? 'aceptada' : 'rechazada').catch(x => U.tostada(x.message)); }
    }
    if (a) { const fila = a.closest('.fila-clase'); fila.style.transition = 'all .4s'; fila.style.opacity = 0; fila.style.transform = 'translateX(40px)'; setTimeout(() => fila.remove(), 400); U.tostada(a.hasAttribute('data-acepta') ? 'Aceptada: la familia ya puede pagar' : 'Te hemos abierto el chat para proponer hora'); }
  });
  // Los enlaces de la cabecera (p. ej. «Solicitudes» → panel.html#solicitudes) cambian de sección sin recargar
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== actual && VISTAS[rol][v]) ir(v); });
  ir(actual, true);
});
</script>
