<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>soon</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%235B78FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500..700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--tinta:#F2F3F5;--azul:#5B78FF}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#000}
  body{color:var(--tinta);font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:center;
    min-height:100svh;overflow:hidden;-webkit-font-smoothing:antialiased}
  /* Negro difuminado: un poco más claro detrás del texto y se funde a negro puro hacia los bordes */
  body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(closest-side,#1A1C21 0%,#0B0C0E 45%,#000 100%);
    filter:blur(40px);animation:respira 9s ease-in-out infinite alternate;pointer-events:none}
  @keyframes respira{from{transform:scale(1)}to{transform:scale(1.08)}}
  h1{position:relative;font-size:clamp(88px,22vw,300px);font-weight:650;letter-spacing:-.075em;line-height:.8;display:flex;align-items:baseline;user-select:none}
  h1 span{display:inline-block;min-width:.5em;text-align:center}
  h1 span.cifrando{font-family:'Geist Mono',ui-monospace,monospace;font-weight:500;color:#5D6270;letter-spacing:-.12em}
  h1 .o{transform-origin:50% 62%}
  h1 .o.parpadea{animation:parpadea 6s 1.5s infinite}
  h1 .punto{min-width:0;width:.16em;height:.16em;border-radius:50%;background:var(--azul);margin-left:.06em;transform:scale(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
  h1 .punto.ver{transform:scale(1)}
  @keyframes parpadea{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  @media (prefers-reduced-motion:reduce){body::before,h1 .o.parpadea{animation:none}}
</style>
</head>
<body>
  <h1 aria-label="soon"><span>s</span><span class="o">o</span><span class="o">o</span><span>n</span><span class="punto" aria-hidden="true"></span></h1>
<script>
(() => {
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const letras = [...document.querySelectorAll('h1 span:not(.punto)')];
  const finales = letras.map(l => l.textContent);
  const signos = '01<>/\\[]{}=+*#%&?:;~';
  const t0 = performance.now();
  function descifrar(t) {
    let listo = true;
    letras.forEach((l, i) => {
      if (!quieto && t - t0 < 450 + i * 260) { l.textContent = signos[Math.floor(Math.random() * signos.length)]; l.classList.add('cifrando'); listo = false; }
      else { l.textContent = finales[i]; l.classList.remove('cifrando'); }
    });
    if (!listo) setTimeout(() => requestAnimationFrame(descifrar), 55);
    else { document.querySelector('.punto').classList.add('ver'); document.querySelectorAll('h1 .o').forEach(o => o.classList.add('parpadea')); }
  }
  requestAnimationFrame(descifrar);
})();
</script>
</body>
</html>
